# The checks of every push: lint, then the unit tests against a real MySQL. The server installs a version only when
# this run has passed (deploy/auto-update.sh reads the result of the job "tests" through the GitHub API).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          # throw-away database of this run only: the same defaults as docker-compose.yml and src/testing/test-app.js
          MYSQL_ROOT_PASSWORD: hok_local_root_password
          MYSQL_DATABASE: hok_scrim
          MYSQL_USER: hok_app
          MYSQL_PASSWORD: hok_local_app_password
        ports:
          - 8080:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -phok_local_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the PDF exports and the server-side rendering run in Chromium, as in the Docker image
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint
      # a test file that cannot reach MySQL or Chromium is skipped: here a skipped test fails the run
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          grep -q "^ℹ skipped 0$" test.log || { echo "Some tests were skipped: MySQL or Chromium was not reachable."; exit 1; }
