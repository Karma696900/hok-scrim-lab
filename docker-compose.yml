# DEVELOPMENT stack (defaults are convenient and INSECURE: local use only).
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   (see README)
services:
  mysql:
    image: mysql:8.4
    # Lean on memory (about 800 MiB by default, a third of that with these): no performance schema, no binary log (backups are
    # dumps), a small cache and connection ceiling. The application pool is 10 connections per process.
    command:
      - --performance-schema=OFF
      - --skip-log-bin
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --key-buffer-size=8M
      - --max-connections=120
      - --table-open-cache=400
      - --thread-cache-size=8
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hok_local_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hok_scrim}
      MYSQL_USER: ${MYSQL_USER:-hok_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hok_local_app_password}
    ports:
      - "127.0.0.1:8080:3306"
    volumes:
      - hok-mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  hok-scrim-lab:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PRERENDER: ${PRERENDER:-true}
      # empty = the defaults: in development only English is drawn at start-up and the Camp crawl waits 10 minutes
      PRERENDER_WARM_ALL: ${PRERENDER_WARM_ALL:-}
      DETAILS_SYNC_STARTUP_DELAY_SECONDS: ${DETAILS_SYNC_STARTUP_DELAY_SECONDS:-}
      PORT: 3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:3000/auth/discord/callback}
      DISCORD_BOT_REDIRECT_URI: ${DISCORD_BOT_REDIRECT_URI:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_ENDPOINT: ${TRANSLATION_ENDPOINT:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-}
      TRANSLATION_DAILY_CHARS: ${TRANSLATION_DAILY_CHARS:-}
      TRANSLATION_SWEEP_SECONDS: ${TRANSLATION_SWEEP_SECONDS:-300}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      MIN_SAMPLE_GAMES: ${MIN_SAMPLE_GAMES:-30}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # the bots server (repository hok-bots): empty = the games against the bots are closed
      BOTS_URL: ${BOTS_URL:-}
      BOTS_SHARED_SECRET: ${BOTS_SHARED_SECRET:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-hok_scrim}
      DB_USER: ${MYSQL_USER:-hok_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hok_local_app_password}
      # empty = the defaults (10 connections, no queue limit, 10 s to connect)
      DB_POOL_SIZE: ${DB_POOL_SIZE:-}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-}
      SHUTDOWN_DRAIN_SECONDS: ${SHUTDOWN_DRAIN_SECONDS:-}
    depends_on:
      mysql:
        condition: service_healthy
    # The development MFA key lives in ./.data (generated once). Without this volume every rebuilt container makes a new key and
    # the authenticator seeds already stored can no longer be decrypted (HTTP 500 at the MFA step).
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
    init: true
    # The server waits SHUTDOWN_DRAIN_SECONDS, then up to 10 s for the connections to end: more than the
    # 10 s Docker waits by default before it kills the process
    stop_grace_period: 30s

volumes:
  hok-mysql-data:
