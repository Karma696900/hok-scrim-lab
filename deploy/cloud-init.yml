#cloud-config
# Paste into "Cloud config" when creating the Hetzner server (Ubuntu 24.04, x86). Replace the SSH key line first.
# What it does: a user "hok" that signs in with your SSH key only (no password, no root), security updates applied
# every night by themselves, fail2ban on SSH, Docker with logs that cannot fill the disk, 2 GB of swap.
# The ports are closed by the Hetzner Cloud Firewall (see deploy/HETZNER.md): Docker publishes past ufw.

groups:
  - docker

users:
  - name: hok
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 REPLACE-WITH-YOUR-PUBLIC-KEY you@pc

disable_root: true
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - fail2ban
  - git
  - age
  - rclone
  - ca-certificates
  - curl

write_files:
  - path: /etc/ssh/sshd_config.d/10-hok.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers hok
      MaxAuthTries 3
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/51hok-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
  - path: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "local", "log-opts": { "max-size": "20m", "max-file": "5" } }

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker fail2ban
  - systemctl restart ssh
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
